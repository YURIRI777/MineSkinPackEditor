    <meta property="og:description" content="登録不要、広告なしでMinecraft統合版で使えるスキンパックを簡単に作成できるサイトです。アニメーションや防具不可視も設定できます">

    <title>MineSkinPackEditor</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <header>
        <h1>MineSkinPackEditor</h1>
    </header>
    <section class="description">
        <p data-i18n-html="description">
            <strong>MineSkinPackEditor</strong> は、簡単にスキンパックを作成できます。
            <br>これはマインクラフト統合版でのみ動作します。
            <br>利用する際は利用規約を確認してね。質問や不具合などはDiscordまで
            <br>※アップロードしたスキン画像はサーバーに送信されず、ブラウザ内でのみ処理されます。
        </p>
        <div class="lang-select-wrapper">
        <select id="langSelect">
            <option value="ja">日本語</option>
            <option value="en">English</option>
        </select>
    </div>
    </section>
    <main>
        <form id="skin-pack-form">
            <div class="form-group">
                <label for="pack-name" data-i18n="packNameLabel">スキンパックの名前:</label>
                <input type="text" id="pack-name" data-i18n-placeholder="packNamePlaceholder" placeholder="スキンパックの名前を入力" required>
            </div>
            <div class="uuid-container">
                <input type="text" id="pack-uuid" value="" readonly>
                <button type="button" onclick="generateUUID('pack-uuid')" data-i18n="regen">再生成</button>
            </div>
            <div class="uuid-container">
                <input type="text" id="module-uuid" value="" readonly>
                <button type="button" onclick="generateUUID('module-uuid')" data-i18n="regen">再生成</button>
            </div>
            <div class="file-upload">
                <label for="skin-image" id="fileName" data-i18n="selectSkin">スキン画像を選択</label>
                <input type="file" id="skin-image" accept="image/png" multiple>
            </div>
            <div id="skinPreview"></div>
            <button type="button" class="create-button" onclick="createSkinPack()" data-i18n="create">スキンパックを作成</button>
        </form>
    </main>
